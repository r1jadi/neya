<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NEYA brag — snapshot review</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #1c1c22;
        color: #e8e8ef;
        font-family: ui-monospace, "JetBrains Mono", monospace;
      }
      h1 {
        font-size: 14px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin: 0 0 12px 0;
        color: #9aa0b4;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        width: 100%;
        border: 1px solid #3a3a46;
      }
      figcaption {
        margin-top: 5px;
        font-size: 11px;
        color: #8f95a8;
      }
    </style>
  </head>
  <body>
    <h1>NEYA brag — snapshot review</h1>
    <div class="grid">
      <figure>
        <img src="frame-00-at-2.4s.png" alt="hook" />
        <figcaption>t=2.4s — hook / headline fully typed</figcaption>
      </figure>
      <figure>
        <img src="frame-01-at-4.6s.png" alt="pulse" />
        <figcaption>t=4.6s — the pulse / stat row</figcaption>
      </figure>
      <figure>
        <img src="frame-02-at-11.2s.png" alt="ask" />
        <figcaption>t=11.2s — the ask / chips + cursor + CTA</figcaption>
      </figure>
      <figure>
        <img src="frame-03-at-15.9s.png" alt="sorted" />
        <figcaption>t=15.9s — sorted / all three cards</figcaption>
      </figure>
      <figure>
        <img src="frame-04-at-19.6s.png" alt="outro plan" />
        <figcaption>t=19.6s — outro / three-stop plan</figcaption>
      </figure>
      <figure>
        <img src="frame-05-at-20.9s.png" alt="brand" />
        <figcaption>t=20.9s — brand payoff</figcaption>
      </figure>
    </div>
  </body>
</html>
