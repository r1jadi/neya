<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NEYA brand region — zoomed render</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #030306;
        color: #9aa0b4;
        font-family: ui-monospace, monospace;
      }
      h1 {
        font-size: 14px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin: 0 0 14px 0;
      }
      p {
        font-size: 12px;
        margin: 6px 0 0 0;
      }
      .row {
        display: flex;
        gap: 22px;
        align-items: flex-start;
      }
      img {
        display: block;
      }
      .raw {
        border: 1px dashed #444;
      }
    </style>
  </head>
  <body>
    <h1>Rendered brand region vs raw asset</h1>
    <div class="row">
      <div>
        <img class="raw" src="zoom-brand.png" width="420" />
        <p>zoomed render of #brand-logo @ t=20.9s</p>
      </div>
      <div>
        <img class="raw" src="logo-check.png" width="300" />
        <p>raw public/neyalogo.png</p>
      </div>
    </div>
  </body>
</html>
